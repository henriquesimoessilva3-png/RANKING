<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ranking BFR — celular</title>
<style>
:root{--bg:#0a0a0a;--dark:#111;--panel:#191919;--surf:#202020;--borda:#2a2a2a;--ouro:#f5c518;--txt:#e8e8e8;--sub:#9a9a9a;--ok:#4ade80;--err:#f87171;--warn:#fbbf24;--nav:62px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100%;margin:0;background:var(--bg);color:var(--txt);font-family:Arial,Helvetica,sans-serif;font-size:15px}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
button,select,input{font:inherit;color:inherit}
a{color:var(--ouro)}
.topo{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--borda);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.linha1{display:flex;align-items:center;gap:8px}
.marca{font-weight:700;letter-spacing:1px;font-size:15px}
.marca b{color:var(--ouro)}
.linha1 select{margin-left:auto;background:var(--surf);border:1px solid var(--borda);border-radius:8px;padding:6px 8px;font-size:14px}
.voltar{font-size:12px;color:var(--sub);text-decoration:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 2px;margin:0 -12px;padding-left:12px;padding-right:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--surf);border:1px solid var(--borda);border-radius:18px;padding:7px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ouro);border-color:var(--ouro);color:#111;font-weight:700}
.chip.ctl{border-color:#555}
.chip .n{opacity:.7;font-weight:400;margin-left:3px}
.barra{display:flex;gap:6px;align-items:center;padding-top:8px;min-width:0}
.barra select.chip{min-width:0;flex:1 1 0;max-width:42%;appearance:none;-webkit-appearance:none;overflow:hidden;text-overflow:ellipsis}
.barra .chip{display:flex;align-items:center;gap:4px;max-width:58%;overflow:hidden;text-overflow:ellipsis}
.conta{margin-left:auto;font-size:12px;color:var(--sub);white-space:nowrap}
.conta b{color:var(--txt);font-size:15px}
main{padding:10px 12px}
.view{display:none}.view.on{display:block}
.card{background:var(--panel);border:1px solid var(--borda);border-radius:12px;padding:12px;margin-bottom:8px}
.jog{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.jog .rk{font-size:13px;color:var(--sub);text-align:center;font-weight:700}
.jog .rk b{display:block;font-size:17px;color:var(--txt)}
.jog .nm{font-weight:700;font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jog .mt{font-size:12px;color:var(--sub);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nota{text-align:right}
.nota b{display:block;font-size:24px;line-height:1;color:var(--ouro)}
.nota span{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
.subs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:9px}
.sb{font-size:10px;color:var(--sub);text-transform:uppercase}
.sb i{display:block;height:5px;background:#2c2c2c;border-radius:3px;margin-top:3px;position:relative;overflow:hidden}
.sb i u{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.sb b{color:var(--txt);font-size:12px;margin-left:2px}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;vertical-align:middle;margin-left:4px}
.tag.m{background:#c0392b;color:#fff}.tag.b{background:#2563eb;color:#fff}.tag.y{background:#16a34a;color:#fff}
.tag.saiu{background:#e8a000;color:#111}.tag.bfr{background:#fff;color:#111}
.tag.verm{background:#ff6b6b;color:#111}.tag.amar{background:var(--ouro);color:#111}.tag.jov{background:var(--ok);color:#111}
.selo{display:inline-block;min-width:18px;padding:0 4px;margin-right:4px;border-radius:3px;font-size:9px;font-weight:700;line-height:14px;text-align:center;color:#fff;vertical-align:middle}
.mais{display:block;width:100%;margin:6px 0 14px;padding:12px;background:var(--surf);border:1px solid var(--borda);border-radius:10px}
.vazio,.carregando{color:var(--sub);text-align:center;padding:40px 10px}
.prog{height:4px;background:#222;border-radius:2px;overflow:hidden;margin:12px auto;max-width:260px}.prog u{display:block;height:100%;width:0;background:var(--ouro);transition:width .2s}
nav.baixo{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0d0d0d;border-top:1px solid var(--borda);display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
nav.baixo button{background:none;border:0;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.baixo button svg{width:22px;height:22px}
nav.baixo button.on{color:var(--ouro)}
.folha{position:fixed;inset:0;z-index:50;display:none}
.folha.on{display:block}
.folha .fundo{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.folha .corpo{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--dark);border-radius:16px 16px 0 0;padding:8px 14px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--borda)}
.folha .puxa{width:40px;height:4px;background:#444;border-radius:2px;margin:4px auto 10px}
.folha h3{margin:4px 0 10px;font-size:17px}
.campo{margin:12px 0}
.campo label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.campo input[type=text],.campo input[type=number],.campo select{width:100%;background:var(--surf);border:1px solid var(--borda);border-radius:8px;padding:10px;font-size:16px}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lista-ck{max-height:46vh;overflow:auto;border:1px solid var(--borda);border-radius:8px}
.lista-ck label{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #1d1d1d;font-size:15px;text-transform:none;letter-spacing:0;color:var(--txt);margin:0}
.lista-ck input{width:20px;height:20px;accent-color:var(--ouro)}
.botoes{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:0;background:var(--dark);padding-top:8px}
.botoes button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--borda);background:var(--surf);font-weight:700}
.botoes button.pri{background:var(--ouro);color:#111;border-color:var(--ouro)}
.ficha-topo{display:flex;gap:12px;align-items:center}
.ficha-topo img.f{width:64px;height:80px;object-fit:cover;border-radius:10px;background:#222;flex:none}
.ficha-topo img.e{width:30px;height:30px;object-fit:contain}
.ficha-topo .nm{font-size:19px;font-weight:700;line-height:1.2}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.kv div{background:var(--panel);border-radius:8px;padding:8px}
.kv b{display:block;font-size:17px}
.kv span{font-size:11px;color:var(--sub)}
.barras{margin:8px 0}
.barras .l{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.barras .l i{height:8px;background:#2c2c2c;border-radius:4px;position:relative;overflow:hidden}
.barras .l i u{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.barras .l b{text-align:right}
.ind{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;margin:6px 0}
.ind span{color:var(--sub)}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acoes a{display:block;text-align:center;padding:12px;border-radius:10px;background:var(--surf);border:1px solid var(--borda);text-decoration:none;color:var(--txt);font-weight:700}
.acoes a.pri{background:var(--ouro);color:#111;border-color:var(--ouro)}
h2{font-size:14px;color:var(--ouro);text-transform:uppercase;letter-spacing:1px;margin:18px 0 8px}
h2 .n{color:var(--sub);font-weight:400;text-transform:none;letter-spacing:0}
.liga-card h4{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between}
.liga-card h4 span{font-size:11px;color:var(--sub);font-weight:400}
.mini{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid #222;font-size:14px}
.mini:first-of-type{border-top:0}
.mini .p{color:var(--sub);font-size:12px;text-align:center}
.mini .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .nm small{display:block;color:var(--sub);font-size:11px}
.mini b{color:var(--ouro);font-size:16px}
.ajuda{font-size:12px;color:var(--sub);line-height:1.45;margin:4px 0 10px}
.ctrbg-v{background:rgba(90,158,74,.25)}.ctrbg-a{background:rgba(201,164,14,.22)}
.ctr{display:inline-block;padding:1px 6px;border-radius:4px}
.fis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.fis div{background:#151515;border-radius:6px;padding:5px 6px}
.fis b{display:block;font-size:15px}
.fis span{font-size:10px;color:var(--sub)}
.fis div.on{outline:1px solid var(--ouro)}
.fis div.on b{color:var(--ouro)}
.zs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.zs span{font-size:11px;padding:1px 6px;border-radius:4px;background:#232323}
</style>
</head>
<body>
<header class="topo">
  <div class="linha1">
    <div class="marca">RANKING <b>BFR</b></div>
    <a class="voltar" href="../">versão completa</a>
    <select id="selPeriodo" aria-label="Período"></select>
  </div>
  <div id="barraView"></div>
</header>

<main>
  <section class="view" id="v-ranking"></section>
  <section class="view" id="v-destaques"></section>
  <section class="view" id="v-alerta"></section>
  <section class="view" id="v-contratos"></section>
  <section class="view" id="v-fisico"></section>
  <div id="status" class="carregando"></div>
</main>

<nav class="baixo" id="nav">
  <button data-v="ranking" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Ranking</button>
  <button data-v="destaques"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>Destaques</button>
  <button data-v="alerta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 20h20L12 3zM12 10v4M12 17v.5"/></svg>Alerta</button>
  <button data-v="contratos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Contratos</button>
  <button data-v="fisico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>Físico</button>
</nav>

<div class="folha" id="folha"><div class="fundo"></div><div class="corpo"><div class="puxa"></div><div id="folhaCorpo"></div></div></div>

<script>
'use strict';
// ============================================================================
// Ranking BFR — versão de celular. Lê os MESMOS arquivos do site completo
// (../data/<periodo>/rankings.json, skillcorner.json, scout_lists.json e os
// arquivos da Ficha), então se atualiza sozinha a cada publicação do Ranking.
// As regras de Destaques, Alerta e Fim de Contrato são cópia das do site.
// ============================================================================
const DATA = '../data/';
const POS = [
  {k:'Goleiro',c:'GK'},{k:'Zagueiro - Direita',c:'ZAG-D'},{k:'Zagueiro - Esquerda',c:'ZAG-E'},
  {k:'Lateral Direito',c:'LAT-D'},{k:'Lateral Esquerdo',c:'LAT-E'},{k:'Volante',c:'VOL'},
  {k:'Medio',c:'MED'},{k:'Meia',c:'MEIA'},{k:'Extremo - Direita',c:'EXT-D'},{k:'Extremo - Esquerda',c:'EXT-E'},{k:'Atacante',c:'ATA'}];
const POSC = Object.fromEntries(POS.map(p=>[p.k,p.c]));
const SA_COUNTRIES = new Set(['Argentina','Colombia','Uruguay','Chile','Paraguay','Ecuador','Peru','Venezuela','Bolivia','Guyana','Suriname']);
const SA_LIGAS = ['argentina','bolivia','chile','colombia','equador','paraguai','peru','uruguai','venezuela','guiana','guyana','suriname'];
const SUBS = [['overall_offensive','OFE'],['overall_deffensive','DEF'],['overall_pass','PAS'],['overall_dgp','DGP'],['phy_score','FÍS']];
const SUBS_GK = [['overall_gk_prevented','EVIT'],['overall_gk_save','DEFES'],['overall_gk_passes','PAS'],['overall_gk_exits','SAÍD'],['phy_score','FÍS']];
const POS_CAT_WEIGHTS = {
  'Zagueiro - Direita':{off:.181,def:.373,pass:.241,dgp:.205},'Zagueiro - Esquerda':{off:.181,def:.373,pass:.241,dgp:.205},
  'Lateral Direito':{off:.304,def:.114,pass:.279,dgp:.303},'Lateral Esquerdo':{off:.309,def:.126,pass:.269,dgp:.297},
  'Volante':{off:.239,def:.072,pass:.528,dgp:.161},'Medio':{off:.262,def:.102,pass:.476,dgp:.160},'Meia':{off:.220,def:.079,pass:.525,dgp:.177},
  'Extremo - Direita':{off:.260,def:.024,pass:.519,dgp:.198},'Extremo - Esquerda':{off:.260,def:.024,pass:.519,dgp:.198},'Atacante':{off:.283,def:.028,pass:.371,dgp:.318}};
const SELO = {footlink:['FL','#a56bff','Footlink'],mercadodepases:['MP','#3b82f6','Merc. de Pases'],transfermarkt:['TM','#0d9488','Transfermarkt'],
  transferroom:['TR','#6366f1','TransferRoom'],fotmob:['FM','#0ea5e9','FotMob'],capology:['CP','#ec4899','Capology'],override:['OV','#e89f00','ajuste manual']};
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

// ---------- utilidades ----------
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const time = r => r['Team within selected timeframe'] || r.Team || '';
const f1 = v => v==null||isNaN(v) ? '—' : (+v).toFixed(1).replace('.',',');
const f0 = v => v==null||isNaN(v) ? '—' : Math.round(v).toLocaleString('pt-BR');
const corNota = v => v>=70?'#4ade80':v>=50?'#d6c35a':v>=30?'#e8a33d':'#f87171';
const guarda = { get(k,d){ try{ const v=localStorage.getItem('rkcel_'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
                 set(k,v){ try{ localStorage.setItem('rkcel_'+k,JSON.stringify(v)); }catch(e){} } };
function regiaoPais(r){ const b=(r['Birth country']||'').trim(); return b==='Brazil'?'brasileiros':SA_COUNTRIES.has(b)?'sulamericanos':'demais'; }
function regiaoLiga(l){ const s=(l||'').toLowerCase(); if(s.startsWith('brasil')) return 'brasileiros'; return SA_LIGAS.some(p=>s.startsWith(p))?'sulamericanos':'demais'; }
function mesesContrato(d){ if(!d) return null; const x=new Date(d); if(isNaN(x)) return null; const n=new Date(); return (x.getFullYear()-n.getFullYear())*12+(x.getMonth()-n.getMonth()); }
function fmtData(d){ if(!d) return '—'; const x=new Date(d); return isNaN(x)?'—':MESES[x.getMonth()]+'/'+x.getFullYear(); }
// mesma régua de cor da aba Fim de Contrato do site: verde até jan/27, amarelo fev a ago/27
function faixaCtr(d){ const x=new Date(d); if(isNaN(x)) return ''; if(x<new Date(new Date().getFullYear(),new Date().getMonth(),1)) return ''; return x<=new Date('2027-01-31T23:59:59')?'ctrbg-v':x<=new Date('2027-08-31T23:59:59')?'ctrbg-a':''; }
function selo(r){ const s=SELO[r.contract_source]; return s?`<span class="selo" style="background:${s[1]}" title="Fonte: ${s[2]}">${s[0]}</span>`:''; }
function saiu(r){ const j=String(r['Team within selected timeframe']||'').trim(); const a=r.Team==null?'':String(r.Team).trim(); if(!j) return ''; if(!a) return '<span class="tag saiu">sem clube</span>'; return a!==j?`<span class="tag saiu">→ ${esc(a)}</span>`:''; }
function idadeTxt(r){ const nasc=nascimento(r); const a=r.Age!=null?Math.floor(r.Age)+' anos':''; return a+(nasc?' · '+nasc:''); }
function nascimento(r){ const fx=FICHA.get(r.primary_key); const d=(fx&&fx.tm&&fx.tm.nasc)||(fx&&fx.sc_nasc)||(SC&&SC[r.primary_key]&&SC[r.primary_key].birthdate)||''; return d&&d.length>=10?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):''; }

// ---------- estado ----------
let SCOUT=[], PERIODO='', REC=[], GRUPOS={}, SC=null, SCper='', LISTAS={}, LIGAS=[], VIEW=guarda.get('view','ranking');
const FICHA = new Map(); const FICHA_LIGA_OK = new Set();
const F = Object.assign({ligas:['Brasil A'],pos:'Zagueiro - Esquerda',busca:'',regPais:'todos',exterior:'',pe:[],idMin:15,idMax:45,minMin:500,minMax:99999,altMin:0,altMax:999,
  ctrMin:-6,ctrMax:90,valMax:0,lista:'',ordem:'auto'}, guarda.get('filtros',{}));

// ---------- carga ----------
async function baixar(url, rotulo){
  $('status').innerHTML=`<div>${esc(rotulo)}</div><div class="prog"><u id="progU"></u></div><div id="progT" style="font-size:12px"></div>`;
  const resp=await fetch(url); if(!resp.ok) throw new Error(resp.status+' em '+url);
  const total=+resp.headers.get('content-length')||0;
  if(!resp.body||!resp.body.getReader) return resp.json();
  const rd=resp.body.getReader(); const partes=[]; let n=0;
  for(;;){ const {done,value}=await rd.read(); if(done) break; partes.push(value); n+=value.length;
    const u=$('progU'); if(u) u.style.width=(total?Math.min(100,n/total*100):Math.min(95,n/3e5))+'%';
    const t=$('progT'); if(t) t.textContent=(n/1048576).toFixed(1).replace('.',',')+' MB'; }
  const buf=new Uint8Array(n); let o=0; partes.forEach(p=>{buf.set(p,o);o+=p.length;});
  return JSON.parse(new TextDecoder().decode(buf));
}
function ordemPeriodo(p){ if(/^\d{4}$/.test(p)) return +p*100; const m=String(p).match(/^([a-z]{3})(\d{2})$/); if(!m) return 0; return (2000+ +m[2])*100+MESES.indexOf(m[1])+1+50; }
async function iniciar(){
  try{
    const per=await fetch(DATA+'periodos.json').then(r=>r.json());
    const ps=per.filter(p=>p.has_ranking).map(p=>p.periodo).sort((a,b)=>ordemPeriodo(b)-ordemPeriodo(a));
    $('selPeriodo').innerHTML=ps.map(p=>`<option value="${p}">${p.toUpperCase()}</option>`).join('');
    const salvo=guarda.get('periodo',''); PERIODO=ps.includes(salvo)?salvo:ps.find(p=>!/^\d{4}$/.test(p))||ps[0];
    $('selPeriodo').value=PERIODO;
    $('selPeriodo').onchange=()=>{ PERIODO=$('selPeriodo').value; guarda.set('periodo',PERIODO); carregarPeriodo(); };
    SCOUT=await fetch(DATA+'scout_lists.json').then(r=>r.json()).then(j=>j.jogadores||[]).catch(()=>[]);
    await carregarPeriodo();
  }catch(e){ $('status').innerHTML='Não consegui carregar os dados: '+esc(e.message||e); }
}
async function carregarPeriodo(){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on')); $('barraView').innerHTML='';
  const j=await baixar(DATA+encodeURIComponent(PERIODO)+'/rankings.json','Carregando o ranking '+PERIODO.toUpperCase()+'…');
  REC=(j.records||[]).filter(r=>r&&r.primary_key);
  REC.forEach(r=>{ if(r.Height===0) r.Height=null; });
  LIGAS=(j.leagues||[...new Set(REC.map(r=>r.league))]).slice().sort();
  F.ligas=F.ligas.filter(l=>LIGAS.includes(l)); if(!F.ligas.length) F.ligas=LIGAS.includes('Brasil A')?['Brasil A']:[LIGAS[0]];
  mapearListas();
  GRUPOS={}; REC.forEach(r=>{ if(r.rank!=null){ const k=r.league+'|'+r.position_group_pt; GRUPOS[k]=Math.max(GRUPOS[k]||0,r.rank);} });
  SC=null; SCper=''; ALERTA.cache={}; ALERTA.dados=null;
  $('status').innerHTML='';
  mostrar(VIEW);
  setTimeout(()=>carregarSC(true),1500);  // data de nascimento + aba Físico, em segundo plano
}
async function carregarSC(silencioso){
  if(SC&&SCper===PERIODO) return SC;
  try{
    const url=DATA+encodeURIComponent(PERIODO)+'/skillcorner.json';

function mapearListas(){
  LISTAS={}; const porNome=new Map();
  REC.forEach(r=>{ const k=norm(r.Player); if(!porNome.has(k)) porNome.set(k,[]); porNome.get(k).push(r); });
  SCOUT.forEach(j=>{ if(!j||!j.lista||!j.nome) return; const cs=porNome.get(norm(j.nome))||[]; const cl=norm(j.clube||'');
    let alvo=cs.filter(r=>cl&&(norm(time(r)).includes(cl)||cl.includes(norm(time(r)))));
    if(!alvo.length&&cs.length===1) alvo=cs;
    alvo.forEach(r=>LISTAS[r.primary_key]=j.lista); });
}

let RK_LISTA=[], RK_MOSTRA=40;
function filtrosAtivos(){ let n=0; if(F.busca)n++; if(F.regPais!=='todos')n++; if(F.exterior)n++; if(F.pe.length)n++; if(F.idMin>15||F.idMax<45)n++; if(F.minMin!==500||F.minMax<99999)n++;
  if(F.altMin>0||F.altMax<999)n++; if(F.ctrMin>-6||F.ctrMax<90)n++; if(F.valMax)n++; if(F.lista)n++; return n; }
function ligasRotulo(){ return F.ligas.length===LIGAS.length?'Todas as ligas':F.ligas.length===1?F.ligas[0]:F.ligas.length+' ligas'; }
function barraRanking(){
  $('barraView').innerHTML=`<div class="chips" id="chipsPos">${POS.map(p=>`<button class="chip${F.pos===p.k?' on':''}" data-p="${p.k}">${p.c}</button>`).join('')}<button class="chip${!F.pos?' on':''}" data-p="">Todas</button></div>
   <div class="barra"><button class="chip ctl" id="bLigas">🏆 ${esc(ligasRotulo())}</button><button class="chip ctl" id="bFiltros">⚙ Filtros${filtrosAtivos()?` <b style="color:var(--ouro)">${filtrosAtivos()}</b>`:''}</button><span class="conta"><b id="rkN">0</b> jog.</span></div>`;
  $('chipsPos').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ F.pos=b.dataset.p; F.ordem='auto'; salvarF(); renderRanking(); });
  $('bLigas').onclick=()=>folhaLigas(F.ligas,l=>{F.ligas=l;salvarF();renderRanking();});
  $('bFiltros').onclick=folhaFiltros;
  const at=$('chipsPos').querySelector('.on'); if(at) at.scrollIntoView({inline:'center',block:'nearest'});
}
function salvarF(){ guarda.set('filtros',F); }
function passaFiltros(r){
  if(F.ligas.length&&!F.ligas.includes(r.league)) return false;
  if(F.pos?r.position_group_pt!==F.pos:r.position_group_pt==='Goleiro') return false;
  if(F.regPais!=='todos'&&regiaoPais(r)!==F.regPais) return false;
  if(F.exterior==='br'&&!(regiaoPais(r)==='brasileiros'&&regiaoLiga(r.league)!=='brasileiros')) return false;
  if(F.exterior==='sa'&&!(regiaoPais(r)==='sulamericanos'&&regiaoLiga(r.league)==='demais')) return false;
  if(F.pe.length&&!F.pe.includes(r.Foot||'unknown')) return false;
  const mi=r['Minutes played']||0; if(mi<F.minMin||mi>F.minMax) return false;
  if(r.Age==null?(F.idMin>15||F.idMax<45):(r.Age<F.idMin||r.Age>F.idMax)) return false;
  if(r.Height!=null&&(r.Height<F.altMin||r.Height>F.altMax)) return false;
  if(F.valMax&&(r['Market value']||0)>F.valMax*1e6) return false;
  if(F.ctrMin>-6||F.ctrMax<90){ const c=mesesContrato(r['Contract expires']); if(c!=null&&(c<F.ctrMin||c>F.ctrMax)) return false; }
  if(F.lista&&listaScout(r)!==F.lista) return false;
  if(F.busca){ const q=norm(F.busca); if(!norm(r.Player).includes(q)&&!norm(time(r)).includes(q)) return false; }
  return true;
}
const ORDENS={auto:'Automática',overall:'Nota geral',rank:'Posição na liga',overall_offensive:'Ofensivo',overall_deffensive:'Defensivo',overall_pass:'Passe',overall_dgp:'Gol/assist. (DGP)',phy_score:'Físico',Age:'Mais novos','Minutes played':'Minutos','Contract expires':'Contrato mais curto'};
function renderRanking(){
  barraRanking();
  let col=F.ordem; if(col==='auto') col=F.pos?'rank':'overall';
  const asc=col==='rank'||col==='Age'||col==='Contract expires';
  RK_LISTA=REC.filter(passaFiltros).sort((a,b)=>{ let va=a[col],vb=b[col];
    if(col==='Contract expires'){ va=va?new Date(va).getTime():null; vb=vb?new Date(vb).getTime():null; }
    if(va==null) return 1; if(vb==null) return -1; return asc?va-vb:vb-va; });
  $('rkN').textContent=RK_LISTA.length.toLocaleString('pt-BR');
  RK_MOSTRA=40; pintarRanking();
  const faltam=F.ligas.slice(0,4).filter(l=>!FICHA_LIGA_OK.has(l));
  if(faltam.length) Promise.all(faltam.map(carregarFichaLiga)).then(()=>{ if(VIEW==='ranking') pintarRanking(); });
}
function pintarRanking(){
  const v=$('v-ranking');
  if(!RK_LISTA.length){ v.innerHTML='<div class="vazio">Nenhum jogador com esses filtros.</div>'; return; }
  const ord=F.ordem==='auto'?'':`<div class="ajuda">Ordenado por <b>${ORDENS[F.ordem]}</b>.</div>`;
  v.innerHTML=ord+RK_LISTA.slice(0,RK_MOSTRA).map(r=>cartao(r)).join('')+(RK_LISTA.length>RK_MOSTRA?`<button class="mais" id="rkMais">Mostrar mais (${(RK_LISTA.length-RK_MOSTRA).toLocaleString('pt-BR')} restantes)</button>`:'');
  const b=$('rkMais'); if(b){ b.onclick=()=>{RK_MOSTRA+=60;pintarRanking();};
    const io=new IntersectionObserver(es=>{ if(es[0].isIntersecting){ io.disconnect(); RK_MOSTRA+=60; pintarRanking(); } },{rootMargin:'400px'}); io.observe(b); }
}

function alertaDestaque(){

  const gkd=['overall_gk_prevented','overall_gk_save','overall_gk_passes','overall_gk_exits'], gkl=['EVIT','DEFES','PAS','SAÍD'], gkw=[.4,.3,.15,.15];

    const g=G[k]||(G[k]={v:d.map(()=>[]),n:0}); d.forEach((f,i)=>{ if(r[f]!=null) g.v[i].push(r[f]); }); g.n++; });

    let wz=0; const z={};
    d.forEach((f,i)=>{ const zz=(r[f]-g.m[i])/g.s[i]; z[L[i]]=zz; wz+=Math.max(0,zz)*(gk?gkw[i]:(pw[wk[i]]||0)); });
    const jovem=(r.Age||99)<=23; const sc=jovem?wz*1.1:wz; const outl=jovem&&(r.rank||999)<=5;

async function alertaPeriodo(p){

    const gg=g[s.league+'||'+s.pos]; if(gg&&gg.length>=5&&s.min>=500&&s.ovr!=null) s.pctl=pc(gg,s.ovr);
    byPk.set(r.primary_key,s); const k=norm(r.Player)+'|'+norm(r['Birth country']); if(!byKey.has(k)) byKey.set(k,[]); byKey.get(k).push(s); });

}

function anoDe(p){ if(/^\d{4}$/.test(p)) return +p; const m=String(p).match(/(\d{2})$/); return m?2000+ +m[1]:new Date().getFullYear(); }

  const bases=i>0?ps.slice(0,i).reverse():[]; const base=bases[1]||bases[0];

  const out=[];

async function alertaConsist(){

  $('barraView').innerHTML=`<div class="chips" id="fsPos"><button class="chip${!FS.pos?' on':''}" data-v="">Todas</button>${POS.filter(p=>p.k!=='Goleiro').map(p=>`<button class="chip${FS.pos===p.k?' on':''}" data-v="${p.k}">${p.c}</button>`).join('')}</div>
    <div class="chips" id="fsM">${FIS.map(c=>`<button class="chip${FS.m===c.k?' on':''}" data-v="${c.k}">${c.l}</button>`).join('')}</div>
    <div class="barra"><button class="chip ctl" id="fsLigas">🏆 ${FS.ligas.length===LIGAS.length?'Todas as ligas':FS.ligas.length===1?esc(FS.ligas[0]):FS.ligas.length+' ligas'}</button><span class="conta"><b id="fsN"></b> jog.</span></div>`;
  $('fsPos').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{FS.pos=b.dataset.v;FS.mostra=40;renderFisico();});
  $('fsM').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{FS.m=b.dataset.v;FS.mostra=40;renderFisico();});
  $('fsLigas').onclick=()=>folhaLigas(FS.ligas,l=>{FS.ligas=l;FS.mostra=40;renderFisico();});
  const at=$('fsM').querySelector('.on'); if(at) at.scrollIntoView({inline:'center',block:'nearest'});
  const rows=REC.filter(r=>SC[r.primary_key]&&r.position_group_pt!=='Goleiro'&&FS.ligas.includes(r.league)&&(!FS.pos||r.position_group_pt===FS.pos)&&(SC[r.primary_key].metrics||{})[FS.m]!=null)
    .sort((a,b)=>SC[b.primary_key].metrics[FS.m]-SC[a.primary_key].metrics[FS.m]);
  $('fsN').textContent=rows.length.toLocaleString('pt-BR');
  const mostrar=['psv99','m_min','hi_distance_p90','sprint_distance_p90','n_sprints_p90','peak_velocity']; if(!mostrar.includes(FS.m)) mostrar[5]=FS.m;
  $('v-fisico').innerHTML=`<div class="ajuda">Dados do SkillCorner do período ${PERIODO.toUpperCase()}. Goleiros não têm tracking. Ordenado por <b>${FIS.find(c=>c.k===FS.m).l}</b>.</div>`+
    (rows.length?rows.slice(0,FS.mostra).map((r,i)=>{ const e=SC[r.primary_key]; const m=e.metrics||{};
      return cartao(r,0,{idx:i+1,valor:(+m[FS.m]).toFixed(FIS.find(c=>c.k===FS.m).d).replace('.',','),rotulo:FIS.find(c=>c.k===FS.m).l,semSubs:true,
        extra:`<div class="fis">${mostrar.map(k=>{ const c=FIS.find(x=>x.k===k); return `<div class="${k===FS.m?'on':''}"><b>${m[k]==null?'—':(+m[k]).toFixed(c.d).replace('.',',')}</b><span>${c.l}</span></div>`; }).join('')}</div><div class="mt" style="font-size:11px;margin-top:5px;color:var(--sub)">${e.n_perf_passed!=null?Math.round(e.n_perf_passed)+' jogos válidos no SkillCorner':''}</div>`}); }).join('')+
      (rows.length>FS.mostra?`<button class="mais" id="fsMais">Mostrar mais (${rows.length-FS.mostra})</button>`:''):'<div class="vazio">Sem dados físicos com esses filtros.</div>');
  const b=$('fsMais'); if(b) b.onclick=()=>{FS.mostra+=60;renderFisico();};
}

iniciar();
</script>
</body>
</html>
