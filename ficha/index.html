<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha do Jogador — BFR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0a0a0a; --bg2:#111; --panel:#171717; --panel2:#1e1e1e; --line:#2a2a2a;
  --gold:#f5c518; --gold2:#c9a40e; --tx:#ececec; --mut:#8a8a8a; --mut2:#5c5c5c;
  --b:#4cc3ff; --b2:#ff7a59; --ok:#4ade80; --mid:#fbbf24; --bad:#f87171;
  --head:'Barlow Condensed',sans-serif; --body:'Barlow',sans-serif; --mono:'Space Mono',monospace;
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:var(--body);font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.94);backdrop-filter:blur(6px);border-bottom:2px solid var(--gold)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px}
.brand{font-family:var(--head);font-weight:800;font-size:22px;letter-spacing:.5px;white-space:nowrap;cursor:pointer}
.brand b{color:var(--gold)}
.tag{font-family:var(--mono);font-size:10px;color:var(--bg);background:var(--gold);padding:2px 6px;border-radius:3px;margin-left:6px;vertical-align:middle}
.search{position:relative;flex:1;max-width:520px;margin-left:auto}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--tx);padding:9px 12px 9px 34px;border-radius:8px;font:inherit}
.search input:focus{outline:none;border-color:var(--gold)}
.search svg{position:absolute;left:10px;top:10px;opacity:.6}
.sug{position:absolute;left:0;right:0;top:42px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sug div{padding:8px 12px;display:flex;justify-content:space-between;gap:8px;cursor:pointer;border-bottom:1px solid var(--line)}
.sug div:hover,.sug div.on{background:var(--panel2)}
.sug small{color:var(--mut);font-family:var(--mono);font-size:11px}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 60px}
.h1{font-family:var(--head);font-size:30px;font-weight:800;margin:4px 0 2px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{font-family:var(--head);font-size:18px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin:0 0 12px;color:var(--tx)}
.card h3 small{font-family:var(--body);text-transform:none;color:var(--mut);font-weight:500;font-size:13px;letter-spacing:0;margin-left:6px}
.grid{display:grid;gap:14px}
.mono{font-family:var(--mono)}
.mut{color:var(--mut)}
/* explorador */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.filters select,.filters input{background:var(--panel);border:1px solid var(--line);color:var(--tx);padding:8px 10px;border-radius:8px;font:inherit;font-size:14px}
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:11px;color:var(--mut);font-weight:400;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #1f1f1f;white-space:nowrap}
tr.cl{cursor:pointer} tr.cl:hover td{background:var(--panel2)}
.pill{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid var(--gold);color:var(--gold)}
.ovr{font-family:var(--head);font-weight:800;font-size:20px}
.tbl-scroll{overflow-x:auto}
/* ficha */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;background:linear-gradient(120deg,#1a1a1a 0%,#0f0f0f 60%);border:1px solid var(--line);border-radius:14px;padding:18px 22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(245,197,24,.12),transparent 70%)}
.foto{position:relative;width:132px;height:132px;border-radius:50%;background:#222;border:3px solid var(--gold);overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover;object-position:top}
.escudo{position:absolute;left:100px;top:96px;width:44px;height:44px;background:#fff;border-radius:50%;padding:5px;border:2px solid var(--bg);z-index:2}
.escudo img{width:100%;height:100%;object-fit:contain}
.nome{font-family:var(--head);font-size:40px;font-weight:800;line-height:1;margin:0}
.clube{color:var(--mut);margin:4px 0 10px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:13px}
.chip b{font-weight:700}
.chip.main{border-color:var(--gold);color:var(--gold);font-weight:700}
.big{text-align:center;min-width:150px;position:relative;z-index:1}
.big .n{font-family:var(--head);font-weight:800;font-size:64px;line-height:.9;color:var(--gold)}
.big .l{font-family:var(--mono);font-size:11px;color:var(--mut);text-transform:uppercase}
.big .r{font-size:15px;margin-top:6px}
.big .r b{font-size:20px;font-family:var(--head)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .l{font-family:var(--mono);font-size:10px;color:var(--mut);text-transform:uppercase}
.kpi .v{font-family:var(--head);font-size:28px;font-weight:800;line-height:1.1}
.kpi .v small{font-size:15px;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto}
.tabs button{padding:10px 14px;font-family:var(--head);font-size:17px;font-weight:700;letter-spacing:.4px;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--tx);border-color:var(--gold)}
.pane{display:none}.pane.on{display:block}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
/* régua */
.regua{position:relative;height:64px;margin:6px 8px 0}
.regua .ln{position:absolute;left:0;right:0;top:30px;height:2px;background:var(--line)}
.regua .d{position:absolute;top:25px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#3a3a3a;border:1px solid #555}
.regua .d.me{width:20px;height:20px;top:21px;margin-left:-10px;background:var(--gold);border:2px solid #fff;z-index:3}
.regua .d.ot{width:16px;height:16px;top:23px;margin-left:-8px;background:var(--b2);border:2px solid #fff;z-index:2}
.regua .lab{position:absolute;top:0;transform:translateX(-50%);font-family:var(--head);font-weight:700;font-size:14px;white-space:nowrap;color:var(--gold)}
.regua .lab.ot{top:44px;color:var(--b2)}
.regua .ax{position:absolute;top:44px;font-family:var(--mono);font-size:10px;color:var(--mut2)}
/* blocos */
.blocos{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.bl{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.bl .l{font-family:var(--head);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.4px}
.bl .v{font-family:var(--head);font-weight:800;font-size:36px;line-height:1.1}
.bl .s{font-family:var(--mono);font-size:10px;color:var(--mut)}
.c-ok{color:var(--ok)}.c-mid{color:var(--mid)}.c-bad{color:var(--bad)}
.sb{display:grid;grid-template-columns:150px 1fr 54px;align-items:center;gap:10px;margin:8px 0}
.sb .bar{height:10px;background:#262626;border-radius:6px;overflow:hidden}
.sb .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:6px}
.sb .v{font-family:var(--head);font-weight:800;font-size:20px;text-align:right}
.fortes li{margin:6px 0} .fortes b{font-family:var(--head);font-size:17px}
/* métricas técnicas */
.mx{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mrow{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:baseline;padding:8px 0;border-bottom:1px solid #222}
.mrow:last-child{border:0}
.mrow .l{font-size:14px}
.mrow .v{font-family:var(--head);font-weight:800;font-size:20px}
.mrow .p{font-family:var(--head);font-weight:800;font-size:15px;min-width:46px;text-align:center;border-radius:5px;padding:1px 6px;color:#0a0a0a}
.mini{grid-column:1/-1;position:relative;height:16px}
.mini .ln{position:absolute;left:0;right:0;top:7px;height:2px;background:#2b2b2b}
.mini i{position:absolute;top:4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#444}
.mini i.me{width:14px;height:14px;top:1px;margin-left:-7px;background:var(--gold);border:2px solid #fff;z-index:2}
.mini i.av{width:2px;height:14px;top:1px;margin-left:-1px;border-radius:0;background:var(--mut)}
/* físico */
.fx{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fk{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.fk.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.fk .l{font-size:13px;color:var(--mut)}
.fk .v{font-family:var(--head);font-weight:800;font-size:30px;line-height:1.1}
.fk .v small{font-size:14px;color:var(--mut)}
.fk .m{font-size:12px;color:var(--mut);font-family:var(--mono)}
.fk .p{font-family:var(--head);font-weight:800;font-size:18px}
.chartbox{position:relative;height:300px}
.note{font-size:13px;color:var(--mut);margin-top:10px}
.note b{color:var(--tx)}
.aviso{border:1px dashed var(--gold2);border-radius:10px;padding:12px 14px;color:#ddd;background:rgba(245,197,24,.05);font-size:14px}
.sofa{display:flex;gap:8px;flex-wrap:wrap}
.sofa div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:center;min-width:92px}
.sofa b{display:block;font-family:var(--head);font-size:26px;font-weight:800}
.sofa small{font-size:11px;color:var(--mut)}
.cmp-head{display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;gap:10px;margin-bottom:10px}
.cmp-p{display:flex;align-items:center;gap:10px}
.cmp-p.r{flex-direction:row-reverse;text-align:right}
.cmp-p img{width:54px;height:54px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--gold)}
.cmp-p.r img{border-color:var(--b2)}
.cmp-p b{font-family:var(--head);font-size:22px}
.cmp-row{display:grid;grid-template-columns:1fr 230px 1fr;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid #222;font-size:14px}
.cmp-row .a,.cmp-row .b{display:flex;align-items:center;gap:8px}
.cmp-row .b{flex-direction:row-reverse}
.cmp-row .bar{flex:1;height:8px;background:#262626;border-radius:5px;overflow:hidden;display:flex}
.cmp-row .a .bar{justify-content:flex-end}
.cmp-row .bar i{display:block;height:100%}
.cmp-row .a .bar i{background:var(--gold)} .cmp-row .b .bar i{background:var(--b2)}
.cmp-row .n{font-family:var(--head);font-weight:800;font-size:17px;min-width:40px}
.cmp-row .b .n{text-align:right}
.cmp-row .lb{text-align:center;font-size:14px;color:var(--tx);line-height:1.2}
.cmp-row .lb small{display:block;font-size:13px;font-family:var(--head);font-weight:800}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.foot{margin-top:28px;font-size:12px;color:var(--mut2);font-family:var(--mono)}
@media (max-width:980px){
  .blocos{grid-template-columns:repeat(3,1fr)} .mx{grid-template-columns:1fr 1fr} .fx{grid-template-columns:repeat(2,1fr)}
  .g2,.g3{grid-template-columns:1fr} .kpis{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .hero{grid-template-columns:1fr;text-align:center;justify-items:center}
  .chips{justify-content:center} .escudo{left:96px} .nome{font-size:32px}
  .mx{grid-template-columns:1fr} .blocos{grid-template-columns:repeat(2,1fr)}
  .brand span{display:none} .sb{grid-template-columns:110px 1fr 46px}
  .cmp-row{grid-template-columns:1fr 120px 1fr;gap:6px} .cmp-row .lb{font-size:12px} .cmp-row .n{font-size:15px;min-width:30px}
}
.voltar{display:none;align-items:center;gap:6px;background:var(--gold);color:#0a0a0a;font-family:var(--head);font-weight:800;font-size:17px;padding:7px 14px;border-radius:8px;white-space:nowrap}
body.embed .voltar{display:inline-flex}
body.embed .brand{display:none}
.load{padding:60px 0;text-align:center;color:var(--mut);font-family:var(--mono)}
.arq{display:inline-flex;align-items:center;gap:10px;background:rgba(245,197,24,.08);border:1px solid var(--gold2);border-radius:10px;padding:8px 14px;margin-top:12px}
.arq .t{font-family:var(--head);font-weight:800;font-size:22px;color:var(--gold)}
.arq .lt{font-family:var(--head);font-weight:800;font-size:15px;background:var(--gold);color:#0a0a0a;border-radius:5px;padding:1px 7px}
.arq small{color:var(--mut);font-size:12px;display:block;line-height:1.1}
.quick{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-top:14px}
.fq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fq div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.fq b{display:block;font-family:var(--head);font-weight:800;font-size:28px;line-height:1.1}
.fq span{font-size:12px;color:var(--mut)}
.fq small{display:block;font-family:var(--mono);font-size:11px;color:var(--mut)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:9px 16px;font-family:var(--head);font-weight:700;font-size:17px;letter-spacing:.3px}
.btn.pri{background:var(--gold);color:#0a0a0a}
.cmp-pick{position:relative;max-width:420px;margin-bottom:14px}
.cmp-pick input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--tx);padding:9px 12px;border-radius:8px;font:inherit}
.cmp-pick .sug{top:40px}
.semfis{color:var(--mut);padding:18px;border:1px dashed var(--line);border-radius:10px}
@media (max-width:980px){.quick{grid-template-columns:1fr}.fq{grid-template-columns:repeat(2,1fr)}}

.ini{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-family:var(--head);font-weight:800;font-size:40px;color:var(--gold)}
.cf{width:54px;height:54px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);background:#222;flex:none}.cf img{width:100%;height:100%;object-fit:cover;object-position:top}.cf .ini{font-size:18px}.cmp-p.r .cf{border-color:var(--b2)}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <button class="voltar" id="voltar" title="Fechar a ficha e voltar ao ranking (Esc)">&larr; Voltar ao ranking</button>
  <div class="brand" onclick="go('')"><b>BFR</b> <span>Ficha do Jogador</span></div>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" placeholder="Buscar outro jogador, clube ou liga…" autocomplete="off">
    <div class="sug" id="sug"></div>
  </div>
</div></div>
<div class="wrap" id="app"><div class="load">carregando…</div></div>
<script>
/* Ficha do Jogador — gerada por Portal Ranking/gerar_ficha_web.py a partir de ficha_molde.html. NÃO editar o gerado. */
const QS=new URLSearchParams(location.search);
const EMBED=QS.get('embed')==='1';
if(EMBED)document.body.classList.add('embed');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(v,d=1)=>v==null?'–':(Math.abs(v)>=1000?Math.round(v).toLocaleString('pt-BR'):(+v).toLocaleString('pt-BR',{maximumFractionDigits:d}));
const pcls=p=>p==null?'mut':p>=70?'c-ok':p>=40?'c-mid':'c-bad';
const pbg=p=>p==null?'#555':p>=70?'#4ade80':p>=40?'#fbbf24':'#f87171';
const dbr=s=>s?s.slice(0,10).split('-').reverse().join('/'):'–';
const slug=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const ligaDe=pk=>pk.split(' - ').slice(-1)[0];
let charts=[];const kill=()=>{charts.forEach(c=>c.destroy());charts=[]};
if(window.Chart){Chart.defaults.color='#9a9a9a';Chart.defaults.font.family="'Barlow',sans-serif";Chart.defaults.borderColor='#262626';}

/* ---------- voltar ao ranking (modo por cima) ---------- */
function fechar(){ if(window.parent!==window) window.parent.postMessage({fichaFechar:1},'*'); else history.back(); }
$('#voltar').onclick=fechar;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&EMBED&&document.activeElement!==$('#q'))fechar()});

/* ---------- dados sob demanda ---------- */
const LIGAS={};let IDX=null;
async function liga(nome){ if(!LIGAS[nome]) LIGAS[nome]=fetch('data/liga/'+slug(nome)+'.json').then(r=>{if(!r.ok)throw new Error('liga');return r.json()}); return LIGAS[nome]; }
async function indice(){ if(!IDX) IDX=fetch('data/indice.json').then(r=>r.json()).then(d=>{d.j.forEach(x=>x.s=(x[1]+' '+x[2]+' '+x[3]).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase());return d}); return IDX; }
async function jogador(pk){ const L=await liga(ligaDe(pk)); const j=L.jogadores[pk]; if(!j) return null; return {...j,pk,liga:L.liga,G:L.grupos[j.g],fis_ate:L.fis_ate,periodo:L.periodo}; }

/* ---------- busca ---------- */
function ligarBusca(inp,box,onPick,filtro){
  let hits=[],sel=-1;
  inp.addEventListener('input',async()=>{
    const t=inp.value.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
    if(t.length<2){box.style.display='none';return}
    const d=await indice();
    hits=d.j.filter(x=>x.s.includes(t)&&(!filtro||filtro(x))).sort((a,b)=>b[6]-a[6]).slice(0,8);sel=-1;
    box.innerHTML=hits.map((h,i)=>`<div data-i="${i}"><span>${esc(h[1])} <small>${esc(h[2])} · ${esc(h[4])}</small></span><small>${esc(h[3])} · ${h[6]??''}</small></div>`).join('')||'<div><small>Nenhum jogador</small></div>';
    box.style.display='block';
  });
  box.addEventListener('mousedown',e=>{const d=e.target.closest('[data-i]');if(d){box.style.display='none';inp.value='';onPick(hits[+d.dataset.i][0])}});
  inp.addEventListener('keydown',e=>{
    if(!hits.length)return;
    if(e.key==='ArrowDown')sel=Math.min(sel+1,hits.length-1);else if(e.key==='ArrowUp')sel=Math.max(sel-1,0);
    else if(e.key==='Enter'){box.style.display='none';inp.value='';onPick(hits[Math.max(sel,0)][0]);return}else return;
    e.preventDefault();[...box.children].forEach((c,i)=>c.classList.toggle('on',i===sel));
  });
  inp.addEventListener('blur',()=>setTimeout(()=>box.style.display='none',150));
}
ligarBusca($('#q'),$('#sug'),pk=>go(pk));
function go(pk){location.hash=pk?encodeURIComponent(pk):''}

/* ---------- explorador (só fora do ranking) ---------- */
let FILT={l:'Brasil A',g:'',imax:'',mmin:450};
async function explorador(){
  kill();const d=await indice();
  const LG=[...new Set(d.j.map(x=>x[3]))].sort(),GR=[...new Set(d.j.map(x=>x[4]))].sort();
  $('#app').innerHTML=`<div class="h1">Explorar jogadores</div><p class="sub">Ranking ${esc(d.periodo)} · <b class="mono">${d.j.length.toLocaleString('pt-BR')}</b> jogadores. Clique para abrir a ficha.</p>

function regua(lista,val,lab,outro){
  const vs=lista.map(x=>x[2]).filter(v=>v!=null);if(!vs.length)return'';
  const mn=Math.min(...vs),mx=Math.max(...vs),p=v=>((v-mn)/(mx-mn||1)*100);
  return `<div class="regua"><div class="ln"></div>${lista.map(x=>x[2]==null?'':`<i class="d" style="left:${p(x[2])}%" title="${esc(x[0])} (${esc(x[1])}) ${x[2]}"></i>`).join('')}
  ${outro?`<i class="d ot" style="left:${p(outro.v)}%"></i><span class="lab ot" style="left:${p(outro.v)}%">${esc(outro.lab)} ${fmt(outro.v,1)}</span>`:''}
  <i class="d me" style="left:${p(val)}%"></i><span class="lab" style="left:${p(val)}%">${esc(lab)} ${fmt(val,1)}</span>
  <span class="ax" style="left:0">${fmt(mn,1)}</span><span class="ax" style="right:0">${fmt(mx,1)}</span></div>`;
}
function destaques(j,n=3){

  return [[...all].sort((a,b)=>b[3]-a[3]).slice(0,n).map(li).join(''),[...all].sort((a,b)=>a[3]-b[3]).slice(0,n).map(li).join('')];
}

      options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{filter:i=>i.datasetIndex===0,callbacks:{label:i=>`${i.raw.n} (${i.raw.c}) · ${i.raw.x} · ${i.raw.y}`}}},
      scales:{x:{title:{display:true,text:j.G.disp.x},grid:{color:'#1f1f1f'}},y:{title:{display:true,text:j.G.disp.y},grid:{color:'#1f1f1f'}}}},
      plugins:[{id:'nomes',afterDatasetsDraw(c){const ctx=c.ctx,m=c.getDatasetMeta(0);ctx.save();ctx.font="700 14px 'Barlow Condensed'";P.forEach((p,i)=>{if(quem(p)){const el=m.data[i];ctx.fillStyle=cor(p);ctx.fillText(p[0],el.x+12,el.y+4)}});ctx.restore()}}]}));}
}
