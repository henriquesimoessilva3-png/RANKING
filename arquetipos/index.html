<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arquétipos × Regiões · Scanner jun26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@500;600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0b0d;--dark:#111318;--panel:#161a20;--panel2:#1b2028;--surface:#20262f;
  --border:#262c36;--border2:#333b47;
  --gold:#f5c518;--gold2:#c9a40e;--gold-dim:#7a6a2a;
  --ink:#f0f2f5;--ink2:#aab2be;--muted:#6b7480;
  --brasil:#22c55e;--sula:#2dd4bf;--jovens:#f5c518;--cepa:#fb923c;--resto:#a78bfa;
  --ref:#f5c518;--jog:#38bdf8;
  --font-mono:'Space Mono',monospace;--font-head:'Barlow Condensed',sans-serif;--font-ui:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 70% -10%,#15181f 0,var(--black) 60%) fixed,var(--black);color:var(--ink);font-family:var(--font-ui);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2b323d;border-radius:6px}::-webkit-scrollbar-track{background:transparent}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:12px 22px;
  background:rgba(10,11,13,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.brand .mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;color:#0a0b0d;font-family:var(--font-head);font-weight:900;font-size:19px}
.brand h1{font-family:var(--font-head);font-weight:800;font-size:20px;letter-spacing:.6px;margin:0;text-transform:uppercase;line-height:1}
.brand .tag{font-size:10.5px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.searchbox{flex:1;max-width:420px;position:relative}
.searchbox input{width:100%;padding:9px 14px 9px 34px;background:var(--panel);border:1px solid var(--border2);border-radius:9px;color:var(--ink);font-family:inherit;font-size:13px;outline:none}
.searchbox input:focus{border-color:var(--gold-dim);box-shadow:0 0 0 3px rgba(245,197,24,.08)}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
.topbar .spacer{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;background:var(--panel);border:1px solid var(--border2);color:var(--ink2);border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none}
.tbtn:hover{border-color:var(--gold-dim);color:var(--ink)}
.tbtn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0b0d;border:none}

.layout{display:flex;align-items:flex-start}
/* ---- sidebar ---- */
.side{width:298px;flex:none;position:sticky;top:55px;height:calc(100vh - 55px);overflow-y:auto;border-right:1px solid var(--border);padding:10px 0 40px;background:linear-gradient(180deg,#0e1014,transparent 200px)}
.side .filt{padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 9px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--ink2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--gold);color:#0a0b0d;border-color:var(--gold)}
.posgrp>.ph{display:flex;align-items:center;gap:8px;padding:12px 18px 6px;position:sticky;top:0;background:linear-gradient(180deg,#0e1014 70%,transparent);z-index:2}
.posgrp>.ph b{font-family:var(--font-head);font-weight:700;font-size:14px;letter-spacing:1.4px;color:var(--gold);text-transform:uppercase}
.posgrp>.ph .ln{flex:1;height:1px;background:var(--border)}
.arch{margin:2px 10px;padding:9px 12px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid transparent;transition:background .12s}
.arch:hover{background:var(--panel)}
.arch.active{background:linear-gradient(135deg,rgba(245,197,24,.14),rgba(245,197,24,.04));border-color:var(--gold-dim)}
.arch .an{font-weight:700;font-size:13px}
.arch .rn{color:var(--muted);font-size:11px;white-space:nowrap}
.arch.active .rn{color:var(--gold)}
.arch.nodata{opacity:.35;cursor:default}
.arch.hidden{display:none}

/* ---- main ---- */
.main{flex:1;min-width:0;padding:24px 30px 80px;max-width:1180px}
.refcard{position:relative;border-radius:16px;padding:22px 24px;margin-bottom:22px;overflow:hidden;
  background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--border2)}
.refcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--gold),var(--gold2))}
.refcard .eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.refcard h2{font-family:var(--font-head);font-weight:900;font-size:34px;letter-spacing:.4px;text-transform:uppercase;margin:2px 0 2px;line-height:1}
.refcard .who{font-size:14px;font-weight:600;margin:6px 0 2px}
.refcard .who .nm{color:var(--gold)}
.refcard .meta{color:var(--ink2);font-size:12.5px}
.refcard .meta b{color:var(--ink)}
.destgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px;margin-top:16px}
.destgrid.fis{margin-top:8px}
.fishdr{margin-top:16px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--jog);font-weight:700}
.dcell.fis{border-color:rgba(56,189,248,.22)}
.dcell{background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:11px;padding:11px 12px}
.dcell .dk{font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px;min-height:26px;font-weight:600}
.dcell .drow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.dcell .dv{font-family:var(--font-mono);font-weight:700;font-size:17px;color:#fff}
.dcell .dp{font-family:var(--font-mono);font-weight:700;font-size:12px;padding:2px 6px;border-radius:6px}
.dcell .dm{font-size:10px;color:var(--muted);margin-top:6px}

/* sort bar */
.sortbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 14px}
.sortbar .sl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.sortbar .sl2{font-size:10.5px;color:var(--muted);margin-left:4px}
.sbtn{padding:6px 13px;border-radius:9px;border:1px solid var(--border2);background:var(--panel);color:var(--ink2);cursor:pointer;font-family:inherit;font-size:12px;font-weight:600}
.sbtn:hover{color:var(--ink)}
.sbtn.on{background:var(--ac,var(--gold));color:#0a0b0d;border-color:transparent}

/* bucket tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 20px}
.tab{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:11px;border:1px solid var(--border2);background:var(--panel);color:var(--ink2);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600}
.tab:hover{color:var(--ink)}
.tab .dt{width:9px;height:9px;border-radius:50%}
.tab.active{background:var(--surface);border-color:var(--border2);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.tab.active.all{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0a0b0d;border:none}

.bucket{margin-bottom:30px;border-radius:14px;border:1px solid var(--border);overflow:hidden;background:var(--panel)}
.bkhead{display:flex;align-items:center;gap:11px;padding:13px 18px;background:linear-gradient(90deg,rgba(255,255,255,.03),transparent)}
.bkhead .dt{width:11px;height:11px;border-radius:50%;flex:none}
.bkhead h3{font-family:var(--font-head);font-weight:700;font-size:19px;letter-spacing:.8px;text-transform:uppercase;margin:0}
.bkhead .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-family:var(--font-mono)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{text-align:left;color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.7px;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--dark)}
thead th.r{text-align:right}
tbody td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
tbody tr.prow{cursor:pointer;transition:background .1s}
tbody tr.prow:hover{background:rgba(255,255,255,.03)}
tbody tr.prow.open{background:rgba(56,189,248,.05)}
.rk{width:30px;text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.rk .medal{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-weight:800;font-size:11px;color:#0a0b0d}
.pn{font-weight:700;font-size:13px}
.pn .nat{margin-right:7px}
.sub{color:var(--muted);font-size:11px;margin-top:1px}
.age,.min{font-family:var(--font-mono);font-size:12px;color:var(--ink2);text-align:right}
.spark{display:inline-flex;gap:3px;align-items:flex-end;height:26px}
.spark i{width:8px;border-radius:2px 2px 0 0;min-height:2px}
.simwrap{display:flex;align-items:center;gap:10px;justify-content:flex-end;min-width:190px}
.simcol{text-align:right}
.simbar{width:56px;height:8px;border-radius:5px;background:#242a33;overflow:hidden;flex:none}
.simbar>i{display:block;height:100%;border-radius:5px}
.simval{font-family:var(--font-mono);font-weight:700;font-size:15px;text-align:right}
.simdual{font-family:var(--font-mono);font-size:9.5px;color:var(--muted);white-space:nowrap;margin-top:1px}
.nofis{color:#7a8290;font-style:italic}
.chev{width:14px;color:var(--muted);transition:transform .15s;display:inline-block}
tr.prow.open .chev{transform:rotate(90deg);color:var(--jog)}

/* expanded comparison — shared-axis paired bars */
tr.exp>td{padding:0;background:#0c0e12}
.expi{padding:8px 20px 18px 46px}
.cmpttl{font-size:11px;color:var(--muted);letter-spacing:.4px;margin:10px 2px 10px;text-transform:uppercase}
.cmpttl b{color:var(--jog)}
.cmpsec{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);font-weight:700;margin:14px 2px 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.cmpsec.fis{color:var(--jog)}
.nofisbox{font-size:11.5px;color:var(--muted);background:rgba(56,189,248,.05);border:1px dashed rgba(56,189,248,.25);border-radius:8px;padding:11px 14px;margin:2px 0}
.cmp{display:grid;grid-template-columns:186px 1fr 92px 92px;gap:2px 14px;align-items:center}
.cmp .hd{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding-bottom:4px;border-bottom:1px solid var(--border);margin-bottom:4px}
.cmp .hd.r{text-align:right}
.ckpi{font-size:12px;padding:5px 0}
.ckpi .lab{font-weight:600}
.ckpi .med{color:var(--muted);font-size:10px;font-family:var(--font-mono)}
.track{position:relative;height:32px;border-radius:8px;background:#12151a;border:1px solid var(--border);overflow:hidden}
.track .grid{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.06)}
.bar{position:absolute;left:0;height:11px;border-radius:0 4px 4px 0;min-width:2px}
.bar.ref{top:4px;background:linear-gradient(90deg,var(--gold2),var(--ref))}
.bar.jog{bottom:4px;background:linear-gradient(90deg,#0e7fb8,var(--jog))}
.pv{font-family:var(--font-mono);font-size:11px;font-weight:700;text-align:right;white-space:nowrap}
.pv .pp{font-size:9.5px;opacity:.75;margin-left:3px}
.pv.ref{color:#fde68a}.pv.jog{color:#bae6fd}
.clegend{display:flex;gap:16px;margin:14px 2px 2px;font-size:10.5px;color:var(--muted);flex-wrap:wrap}
.clegend span{display:inline-flex;align-items:center;gap:6px}
.clegend .sw{width:12px;height:8px;border-radius:2px}

.empty{padding:22px;text-align:center;color:var(--muted)}
.loading{padding:80px;text-align:center;color:var(--muted);font-family:var(--font-mono)}
footer{border-top:1px solid var(--border);padding:20px 30px;color:var(--muted);font-size:11px;line-height:1.7;max-width:1180px}
footer b{color:var(--ink2)}
@media(max-width:900px){.side{display:none}.main{padding:18px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="mark">A</div><div><h1>Arquétipos × Regiões</h1><div class="tag">Scanner · base jun26 · 2025/26</div></div></div>
  <div class="searchbox">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" placeholder="Buscar arquétipo, referência ou jogador…" oninput="onSearch()">
  </div>
  <div class="spacer"></div>
  <a class="tbtn" href="Arquetipos_Regioes_jun26.pdf" download>⬇ PDF</a>
</div>

<div class="layout">
  <nav class="side" id="side"></nav>
  <main class="main" id="main"><div class="loading">Carregando dados…</div></main>
</div>
<footer id="foot"></footer>

<script>
const BC={brasil:'var(--brasil)',sula:'var(--sula)',jovens:'var(--jovens)',cepa:'var(--cepa)',resto:'var(--resto)'};
let DATA=null,NAT={},CUR=null,curB='all',posFilter='all',search='',sortBy='sim_comb';

const _dataP = window.__ARQ__ ? Promise.resolve(window.__ARQ__) : fetch('data/arquetipos.json').then(r=>r.json());
const _natP  = window.__NAT__ ? Promise.resolve(window.__NAT__) : fetch('data/nat.json').then(r=>r.json()).catch(()=>({}));
Promise.all([_dataP,_natP]).then(([d,n])=>{ DATA=d;NAT=n;buildSide();const f=firstData();if(f)select(f.gi,f.ri);buildFoot(); });

const flag=c=>(NAT[c]&&NAT[c].f)||'';
const ptc =c=>(NAT[c]&&NAT[c].pt)||c||'—';
function firstData(){for(let gi=0;gi<DATA.grupos.length;gi++)for(let ri=0;ri<DATA.grupos[gi].refs.length;ri++)if(!DATA.grupos[gi].refs[ri].sem_dados)return{gi,ri};}
function fmt(v){if(v==null)return'—';v=+v;if(Math.abs(v)>=100)return Math.round(v);if(Math.abs(v)>=10)return v.toFixed(1);return v.toFixed(2);}
// magnitude ramps (single-hue sequential)
function seqGold(p){p=Math.max(0,Math.min(100,p||0));const l=32+(p/100)*38;return `hsl(45 ${55+p*.35}% ${l}%)`;}
function seqCyan(p){p=Math.max(0,Math.min(100,p||0));const l=34+(p/100)*34;return `hsl(196 ${52+p*.32}% ${l}%)`;}
function simColor(s){return seqGold(s);}
function pctColor(p){return seqGold(p);}
function fisColor(p){return seqCyan(p);}
const METRICS={similarity:{lab:'téc',col:'var(--gold)',cf:seqGold},sim_fis:{lab:'fís',col:'var(--jog)',cf:seqCyan},sim_comb:{lab:'comb',col:'#c084fc',cf:(p)=>{p=Math.max(0,Math.min(100,p||0));return `hsl(270 60% ${40+p*.3}%)`;}}};
function setSort(m){sortBy=m;render();}
function sortedPlayers(b){const arr=b.players.slice();arr.sort((a,c)=>{const va=a[sortBy],vc=c[sortBy];if(va==null&&vc==null)return 0;if(va==null)return 1;if(vc==null)return -1;return vc-va;});return arr;}
function medal(i){const c=['#f5c518','#c7ccd4','#cd7f32'][i];return c?`<span class="medal" style="background:${c}">${i+1}</span>`:(i+1);}

function buildSide(){
  let h=`<div class="filt" id="posfilt"></div>`;
  const poss=[['all','Todas']].concat(DATA.grupos.map(g=>[g.pos,g.label]));
  h=`<div class="filt">`+poss.map(p=>`<button class="chip ${p[0]==='all'?'on':''}" data-p="${p[0]}" onclick="setPos('${p[0]}')">${p[1]}</button>`).join('')+`</div>`;
  DATA.grupos.forEach((g,gi)=>{
    h+=`<div class="posgrp" data-pos="${g.pos}"><div class="ph"><b>${g.label}</b><span class="ln"></span></div>`;
    g.refs.forEach((r,ri)=>{
      const cls=r.sem_dados?'arch nodata':'arch';
      const rn=r.sem_dados?`${r.nome} · s/ dados`:r.nome;
      h+=`<div class="${cls}" data-gi="${gi}" data-ri="${ri}" data-txt="${(r.archetype+' '+r.nome).toLowerCase()}" id="a_${gi}_${ri}" ${r.sem_dados?'':`onclick="select(${gi},${ri})"`}>
        <span class="an">${r.archetype}</span><span class="rn">${rn}</span></div>`;
    });
    h+='</div>';
  });
  document.getElementById('side').innerHTML=h;
}
function setPos(p){posFilter=p;document.querySelectorAll('#side .chip').forEach(c=>c.classList.toggle('on',c.dataset.p===p));applyFilter();}
function onSearch(){search=document.getElementById('q').value.trim().toLowerCase();applyFilter();}
function applyFilter(){
  document.querySelectorAll('.posgrp').forEach(pg=>{
    const posOk=posFilter==='all'||pg.dataset.pos===posFilter;let any=false;
    pg.querySelectorAll('.arch').forEach(a=>{
      const txt=a.dataset.txt||'';
      const ok=posOk&&(!search||txt.includes(search));
      a.classList.toggle('hidden',!ok);if(ok)any=true;
    });
    pg.style.display=any?'':'none';
  });
}

function select(gi,ri){
  document.querySelectorAll('.side .arch.active').forEach(e=>e.classList.remove('active'));
  const el=document.getElementById(`a_${gi}_${ri}`);if(el)el.classList.add('active');
  CUR={gi,ri};curB='all';render();window.scrollTo(0,0);
}
function setB(k){curB=k;render();}

function render(){
  const g=DATA.grupos[CUR.gi],r=g.refs[CUR.ri],rf=r.ref;
  let h=`<div class="refcard">
    <div class="eyebrow">${g.label} · Referência de arquétipo</div>
    <h2>${r.archetype}</h2>
    <div class="who"><span class="nm">${flag(rf.nat)} ${rf.player}</span></div>
    <div class="meta"><b>${rf.team||''}</b> · ${rf.league||''} · ${rf.age!=null?Math.round(rf.age)+' anos':''} · ${ptc(rf.nat)} · grupo de comparação <b>${rf.pos_group}</b></div>
    <div class="destgrid">`;
  r.destaque.forEach(d=>{
    h+=`<div class="dcell"><div class="dk">${d.label}</div>
      <div class="drow"><span class="dv">${fmt(d.ref_v)}</span><span class="dp" style="background:${pctColor(d.ref_p)};color:#0a0b0d">p${d.ref_p}</span></div>
      <div class="dm">média da posição ${fmt(d.med)}</div></div>`;
  });
  h+=`</div>`;
  if(r.destaque_fis&&r.destaque_fis.length){
    h+=`<div class="fishdr">⚡ Físico · SkillCorner</div><div class="destgrid fis">`;
    r.destaque_fis.forEach(d=>{
      h+=`<div class="dcell fis"><div class="dk">${d.label}</div>
        <div class="drow"><span class="dv">${fmt(d.ref_v)}</span><span class="dp" style="background:${fisColor(d.ref_p)};color:#04121a">p${d.ref_p}</span></div>
        <div class="dm">média da posição ${fmt(d.med)}</div></div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;

  // sort toggle (combinada é o critério de seleção dos 10)
  h+=`<div class="sortbar"><span class="sl">Ordenar por</span>
    ${[['sim_comb','Combinada','#c084fc'],['similarity','Técnica','var(--gold)'],['sim_fis','Física','var(--jog)']].map(o=>
      `<button class="sbtn ${sortBy===o[0]?'on':''}" style="${sortBy===o[0]?`--ac:${o[2]}`:''}" onclick="setSort('${o[0]}')">${o[1]}</button>`).join('')}
    <span class="sl2">os 10 de cada bucket são selecionados pela combinada (60% téc + 40% fís)</span></div>`;

  h+=`<div class="tabs"><button class="tab all ${curB==='all'?'active':''}" onclick="setB('all')">Todos os buckets</button>`;
  r.buckets.forEach(b=>h+=`<button class="tab ${curB===b.key?'active':''}" onclick="setB('${b.key}')"><span class="dt" style="background:${BC[b.key]}"></span>${b.label.split(' (')[0]} <span style="color:var(--muted);font-family:var(--font-mono);font-size:11px">${b.n}</span></button>`);
  h+=`</div>`;

  r.buckets.forEach(b=>{if(curB==='all'||curB===b.key)h+=bucketHTML(r,b);});
  document.getElementById('main').innerHTML=h;
}

function bucketHTML(r,b){
  const id=b.key;
  let h=`<div class="bucket"><div class="bkhead"><span class="dt" style="background:${BC[id]}"></span><h3>${b.label}</h3><span class="cnt">${b.n} jogadores</span></div>`;
  if(!b.players.length)return h+`<div class="empty">Nenhum jogador neste bucket.</div></div>`;
  const M=METRICS[sortBy];
  h+=`<table><thead><tr>
    <th class="rk">#</th><th>Jogador</th><th>Clube / Liga</th>
    <th class="r">Idade</th><th class="r">Min</th>
    <th>Perfil nos KPIs destaque</th><th class="r">Similaridade (${M.lab})</th></tr></thead><tbody>`;
  sortedPlayers(b).forEach((p,i)=>{
    const spark=p.cmp.map(c=>`<i style="height:${Math.max(2,(c.pctl||0)/100*26)}px;background:${pctColor(c.pctl||0)}"></i>`).join('');
    const val=p[sortBy];const sc=val==null?'#555':M.cf(val);
    const rid=`${CUR.gi}_${CUR.ri}_${id}_${p.pk.replace(/[^a-zA-Z0-9]/g,'')}`;
    const fisTxt=p.no_fis?'<span class="nofis">sem físico</span>':`fís ${p.sim_fis}`;
    h+=`<tr class="prow" id="pr_${rid}" onclick="tog('${rid}')">
      <td class="rk">${medal(i)}</td>
      <td><div class="pn"><span class="nat" title="${ptc(p.nat)}">${flag(p.nat)}</span>${p.player}</div></td>
      <td><div>${p.team||''}</div><div class="sub">${p.league||''}</div></td>
      <td class="age">${p.age!=null?Math.round(p.age):'—'}</td>
      <td class="min">${p.min?p.min.toLocaleString('pt-BR'):'—'}</td>
      <td><div class="spark">${spark}</div></td>
      <td><div class="simwrap"><div class="simcol"><div class="simval" style="color:${sc}">${val==null?'—':val+'%'}</div><div class="simdual">téc ${p.similarity} · ${fisTxt} · comb ${p.sim_comb}</div></div><div class="simbar"><i style="width:${Math.max(4,val||0)}%;background:${sc}"></i></div><span class="chev">›</span></div></td>
    </tr>
    <tr class="exp" id="ex_${rid}" style="display:none"><td colspan="7"><div class="expi">${cmpHTML(r,p)}</div></td></tr>`;
  });
  return h+`</tbody></table></div>`;
}

function cmpGrid(items){
  let h=`<div class="cmp"><div class="hd">KPI destaque</div><div class="hd">Percentil na posição (0–100)</div><div class="hd r">Referência</div><div class="hd r">Jogador</div>`;
  items.forEach(c=>{
    const rp=c.ref_p==null?0:c.ref_p, jp=c.pctl==null?0:c.pctl;
    let grid='';for(let g=25;g<100;g+=25)grid+=`<span class="grid" style="left:${g}%"></span>`;
    h+=`<div class="ckpi"><div class="lab">${c.label}</div><div class="med">média pos. ${fmt(c.med)}</div></div>
      <div class="track">${grid}<div class="bar ref" style="width:${rp}%"></div><div class="bar jog" style="width:${jp}%"></div></div>
      <div class="pv ref">${fmt(c.ref_v)}<span class="pp">p${c.ref_p==null?'—':c.ref_p}</span></div>
      <div class="pv jog">${fmt(c.val)}<span class="pp">p${c.pctl==null?'—':c.pctl}</span></div>`;
  });
  return h+`</div>`;
}
function cmpHTML(r,p){
  let h=`<div class="cmpttl">Comparativo com a referência — dados puros e percentil · <b>${flag(p.nat)} ${p.player}</b> vs ${flag(r.ref.nat)} ${r.ref.player}
    &nbsp;·&nbsp; téc <b style="color:var(--gold)">${p.similarity}%</b> · fís <b style="color:var(--jog)">${p.no_fis?'—':p.sim_fis+'%'}</b> · comb <b style="color:#c084fc">${p.sim_comb}%</b></div>`;
  h+=`<div class="cmpsec">Técnico (estilo)</div>`+cmpGrid(p.cmp);
  h+=`<div class="cmpsec fis">⚡ Físico (SkillCorner)</div>`;
  if(p.no_fis || !p.cmp_fis || !p.cmp_fis.length || p.cmp_fis.every(c=>c.val==null&&c.ref_v==null)){
    h+=`<div class="nofisbox">Sem dados físicos SkillCorner suficientes para ${p.player} (cobertura: América do Sul + principais ligas da Europa).</div>`;
  } else {
    h+=cmpGrid(p.cmp_fis);
  }
  h+=`<div class="clegend"><span><span class="sw" style="background:linear-gradient(90deg,var(--gold2),var(--ref))"></span>Referência (${r.ref.player})</span><span><span class="sw" style="background:linear-gradient(90deg,#0e7fb8,var(--jog))"></span>${p.player}</span><span>barras = percentil na posição · números = valor puro e percentil</span></div>`;
  return h;
}
function tog(id){const e=document.getElementById('ex_'+id),pr=document.getElementById('pr_'+id);const open=e.style.display==='none';e.style.display=open?'':'none';pr.classList.toggle('open',open);}

function buildFoot(){const m=DATA.meta;
  document.getElementById('foot').innerHTML=
   `<b>Base ${m.periodo}</b> · mín. ${m.min_minutos} min jogados · jovens ≤ ${m.jovem_idade_max} anos · top ${m.top_n} por bucket. Buckets são listas independentes (um jogador pode aparecer em mais de uma). ${m.nota}<br>
    <b>Ordenação:</b> ${m.ordenacao||''}<br>
    <b>Similaridade técnica:</b> ${m.similaridade}<br>
    <b>Similaridade física:</b> ${m.similaridade_fis||''} &nbsp; <b>Combinada:</b> ${m.similaridade_comb||''}<br>
    <b>Buckets:</b> Brasileiros = nacionalidade Brasil · Sul-americanos = demais nacionalidades da América do Sul · Jovens = idade ≤ ${m.jovem_idade_max} · Am. Central/Caribe·Espanha·Portugal·Angola · Resto do mundo = demais nacionalidades.`;
}
</script>
</body>
</html>
